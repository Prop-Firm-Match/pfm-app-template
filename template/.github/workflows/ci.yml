name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # gitleaks itself is MIT-licensed and free; it is the gitleaks-action
      # wrapper that requires a paid GITLEAKS_LICENSE for repos owned by an
      # organization, and fails the job without one. Run the CLI directly so
      # the scan works on any repo. --redact keeps matches out of the logs.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
      - run: gitleaks git --redact --no-banner .

  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run type-check
      - run: pnpm run --if-present test
      - run: pnpm run build
