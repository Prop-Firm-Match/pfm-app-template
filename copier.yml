_subdirectory: template
_envops:
  keep_trailing_newline: true

project_name:
  type: str
  help: "Repo/app name (kebab-case), used as the CF Workers deploy name and *.propfirmmatch.solutions subdomain"
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    project_name must be lowercase kebab-case (e.g. loyalty-ops-tool)
    {% endif %}

owner:
  type: str
  help: "Human owner's email — the person accountable for this app (not a bot/service account). Lands in CLAUDE.md/README.md and CODEOWNERS."
  validator: >-
    {% if not (owner | regex_search('^[^@\s]+@[^@\s]+\.[^@\s]+$')) %}
    owner must be a real email address (e.g. name@propfirmmatch.com)
    {% endif %}

deploy_target:
  type: str
  help: "Where does this app run? cloudflare-workers = Vite SPA + tRPC API in one Cloudflare Worker (current default -- Hyperdrive/R2/CF Access all assume this). vercel = Next.js App Router on Vercel, tRPC as a Vercel Function -- no Hyperdrive/R2/CF Access equivalent yet, see MAINTAINING.md's Known gaps before picking it for anything that needs those."
  choices:
    cloudflare-workers: cloudflare-workers
    vercel: vercel
  default: cloudflare-workers

data_source:
  type: str
  help: "Where does this app's data come from?"
  choices:
    postgres: postgres
    bigquery: bigquery
    google-sheets: google-sheets
    "external-api-only (no owned datastore)": external-api-only
  default: external-api-only

auth:
  type: str
  help: "How do users sign in? cloudflare-access = zero app code, gate the route in the CF dashboard (simplest, recommended default for internal tools, deploy_target=cloudflare-workers only). none = no sign-in at all, anyone with the URL has full access -- only pick this for something genuinely meant to be public."
  choices:
    clerk: clerk
    google-oauth: google-oauth
    cloudflare-access: cloudflare-access
    "none (public -- no login, anyone with the URL gets full access)": none
  default: cloudflare-access
  validator: >-
    {% if auth == "cloudflare-access" and deploy_target == "vercel" %}
    auth=cloudflare-access needs deploy_target=cloudflare-workers -- Cloudflare
    Access gates traffic at Cloudflare's edge, which a Vercel-hosted domain
    doesn't pass through. Pick clerk, google-oauth, or none instead.
    {% endif %}

enable_i18n:
  type: bool
  help: "Add react-i18next scaffolding?"
  default: false

enable_testing:
  type: bool
  help: "Add Vitest unit-test scaffolding?"
  default: true

enable_file_storage:
  type: bool
  help: "Add R2 file-upload scaffolding? (deploy_target=cloudflare-workers only -- no Vercel-equivalent scaffolding yet.)"
  default: false
  validator: >-
    {% if enable_file_storage and deploy_target == "vercel" %}
    enable_file_storage needs deploy_target=cloudflare-workers -- R2 is a
    Cloudflare binding, not available to a Vercel deploy. See
    MAINTAINING.md's Known gaps.
    {% endif %}

enable_storybook:
  type: bool
  help: "Add Storybook for previewing/developing the design-system components (Button, Card)?"
  default: false
